<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-hero">
      <h1 class="popup-title">📞 Moshi Moshi</h1>
      <p class="popup-subtitle">Chat with friends while you watch — same vibe as the Moshi Moshi web.</p>
    </div>

    <div class="card">
      <div class="field">
        <div class="label">Your name</div>
        <input class="input" type="text" id="username" placeholder="e.g. Ritesh" autocomplete="off" />
      </div>

      <div class="field">
        <div class="label">Room ID</div>
        <input class="input" type="text" id="roomId" placeholder="e.g. movie-night-123" autocomplete="off" />
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="connectBtn">Connect</button>
        <button class="btn btn-secondary" id="disconnectBtn" style="display:none;">Disconnect</button>
      </div>

      <div class="actions" style="margin-top:10px;">
        <button class="btn btn-ghost" id="toggleChat" style="display:none;">Toggle chat</button>
        <button class="btn btn-ghost" id="openChat" title="Opens the chat window on the current tab">Open chat</button>
      </div>

      <div class="status-row">
        <div id="status" class="status-pill disconnected">Disconnected</div>
        <div class="tiny">Tip: double‑click chat header to resize.</div>
      </div>

      <div class="settings">
        <div class="settings-label">Message sound</div>
        <label class="switch" title="Toggle notification sound">
          <input type="checkbox" id="soundToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings">
        <div class="settings-label">Volume <span class="settings-value" id="volumeValue">100%</span></div>
        <input type="range" id="volumeSlider" min="0" max="100" value="100" class="range" />
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
